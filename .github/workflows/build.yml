name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: unzip -qo nag-android.zip

      # The signing key is not in the repo. Without it the APK builds unsigned and
      # won't install over your existing one, so fail loudly rather than quietly.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p nag/signing
          echo "$KEYSTORE_B64" | base64 -d > nag/signing/nag.jks
          keytool -list -keystore nag/signing/nag.jks -storepass nagsigning > /dev/null
          echo "Signing key restored."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: nag
        env:
          # Offset so a fresh repo's run numbers still outrank the old repo's builds.
          # Android refuses to install an APK whose versionCode is lower than the installed one.
          BUILD_NUMBER: ${{ github.run_number + 100 }}
        run: gradle assembleRelease --no-daemon

      - name: Confirm the APK is signed
        run: |
          APK=nag/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No APK produced"; exit 1; }
          unzip -l "$APK" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.SF" \
            || echo "::warning::Could not confirm v1 signature block; v2/v3-only signing is fine."

      - uses: actions/upload-artifact@v4
        with:
          name: nag-apk
          path: nag/app/build/outputs/apk/release/app-release.apk

      # Published so Obtainium can watch this repo for updates.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number + 100 }}" \
            nag/app/build/outputs/apk/release/app-release.apk \
            --title "Nag 1.${{ github.run_number + 100 }}" \
            --notes "Build ${{ github.run_number + 100 }}" \
            --repo "${{ github.repository }}"
