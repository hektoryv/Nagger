name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Run numbers restarted when this repo was created, so an offset keeps versionCode
      # ahead of the builds already installed on the phone. Android refuses to install a
      # downgrade. Arithmetic lives in the shell because GitHub expressions have no + operator.
      - name: Work out the version number
        run: echo "BUILD_NUMBER=$((${{ github.run_number }} + 100))" >> "$GITHUB_ENV"

      # The signing key is never committed. Without it the APK builds unsigned and can't
      # install over the existing one, so fail loudly rather than shipping a dud.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/nag.jks
          keytool -list -keystore signing/nag.jks -storepass nagsigning > /dev/null
          echo "Signing key restored."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Check the APK exists
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No APK produced"; exit 1; }
          echo "Built version 1.$BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: nag-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Published so Obtainium can watch this repo for updates.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.$BUILD_NUMBER" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Nag 1.$BUILD_NUMBER" \
            --notes "Build $BUILD_NUMBER" \
            --repo "${{ github.repository }}"
